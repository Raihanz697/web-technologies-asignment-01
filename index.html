<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div id="login-section" class="form-box">
            <h2>Login Form</h2>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="login_email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="login_password" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
                <p class="switch-link">
                    Don't have an account? <a href="#register-section">Register here</a>
                </p>
            </form>
        </div>

        <div id="register-section" class="form-box">
            <h2>Registration Form</h2>
            <form action="/register" method="POST">

                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="user_email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="user_password" placeholder="Create a strong password"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone_number" placeholder="e.g., 01712345678" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="inline-group">
                        <label for="male">
                            <input type="radio" id="male" name="gender" value="male" required> Male
                        </label>
                        <label for="female">
                            <input type="radio" id="female" name="gender" value="female"> Female
                        </label>
                        <label for="other">
                            <input type="radio" id="other" name="gender" value="other"> Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Skills / Interests</label>
                    <div class="inline-group">
                        <label for="skill-html">
                            <input type="checkbox" id="skill-html" name="skills[]" value="HTML"> HTML
                        </label>
                        <label for="skill-css">
                            <input type="checkbox" id="skill-css" name="skills[]" value="CSS"> CSS
                        </label>
                        <label for="skill-js">
                            <input type="checkbox" id="skill-js" name="skills[]" value="JavaScript"> JavaScript
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="division">Division / City</label>
                    <select id="division" name="division" required>
                        <option value="">-- Select your division --</option>
                        <option value="dhaka">Dhaka</option>
                        <option value="sylhet">Sylhet</option>
                        <option value="chittagong">Chittagong</option>
                        <option value="rajshahi">Rajshahi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" name="user_bio" rows="3" placeholder="Write something about yourself..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="terms" class="terms-label">
                        <input type="checkbox" id="terms" name="agree_terms" value="accepted" required>
                        I agree to the Terms and Conditions
                    </label>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary">Register</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>

                <p class="switch-link">
                    Already have an account? <a href="#login-section">Login here</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
